<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六级远征 — CET-6 RPG</title>
<style>
/* ===== 像素风RPG基础 ===== */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }
body {
  font-family: 'Press Start 2P', 'Courier New', monospace;
  background: #0a0a1a;
  color: #e0d8c8;
  min-height: 100vh;
  overflow-x: hidden;
}
/* ===== 像素边框 ===== */
.pixel-box {
  border: 4px solid #4a3a2a;
  border-top-color: #7a6a5a;
  border-left-color: #7a6a5a;
  border-bottom-color: #2a1a0a;
  border-right-color: #2a1a0a;
  background: #1a1a2e;
  image-rendering: pixelated;
}
.pixel-btn {
  display: inline-block;
  padding: 10px 20px;
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  background: #3a5a7a;
  border: 4px solid #5a7a9a;
  border-top-color: #8aaaca;
  border-left-color: #8aaaca;
  border-bottom-color: #2a3a4a;
  border-right-color: #2a3a4a;
  color: #e0d8c8;
  cursor: pointer;
  text-shadow: 2px 2px 0 #1a2a3a;
  transition: 0.1s;
}
.pixel-btn:hover { background: #4a6a8a; transform: translateY(-2px); }
.pixel-btn:active { transform: translateY(2px); border-top-color: #2a3a4a; border-left-color: #2a3a4a; border-bottom-color: #8aaaca; border-right-color: #8aaaca; }
.pixel-btn.gold { background: #8a7a3a; border-color: #aa9a5a; border-top-color: #ccbb7a; border-left-color: #ccbb7a; border-bottom-color: #6a5a2a; border-right-color: #6a5a2a; }
.pixel-btn.green { background: #3a7a3a; border-color: #5a9a5a; border-top-color: #7abb7a; border-left-color: #7abb7a; border-bottom-color: #2a5a2a; border-right-color: #2a5a2a; }
.pixel-btn.red { background: #7a3a3a; border-color: #9a5a5a; border-top-color: #bb7a7a; border-left-color: #bb7a7a; border-bottom-color: #5a2a2a; border-right-color: #5a2a2a; }
/* ===== 开场画面 ===== */
#screen-intro {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #0a0a1a;
  z-index: 100;
  padding: 20px;
}
.intro-title {
  font-size: 28px; color: #ffd700; text-shadow: 4px 4px 0 #8a6a00, 0 0 20px #ffd70088;
  margin-bottom: 30px; text-align: center; line-height: 1.6;
}
.intro-sub { font-size: 11px; color: #aaa; margin-bottom: 15px; text-align: center; line-height: 2; }
.intro-story {
  max-width: 650px; font-size: 11px; line-height: 2.2; color: #ccc;
  margin-bottom: 30px; text-align: center; padding: 20px;
  border: 2px solid #4a3a2a; background: #12122a;
}
.intro-story em { color: #ffd700; font-style: normal; }
.stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.star { position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; animation: twinkle 2s infinite; }
@keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
/* ===== 地图画面 ===== */
#screen-map { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
.map-title { font-size: 14px; text-align: center; color: #ffd700; margin: 10px 0 5px; padding: 10px; }
.map-hud { display: flex; justify-content: space-between; align-items: center; background: #12122a; padding: 10px 15px; border: 2px solid #4a3a2a; margin-bottom: 15px; font-size: 10px; }
.map-hud .hp { color: #ff6b6b; }
.map-hud .lv { color: #7abb7a; }
.map-hud .xp { color: #7abaff; }
.map-hud .combo { color: #ffd700; }
/* ===== 秘境节点 ===== */
.dungeons { display: flex; flex-direction: column; gap: 10px; }
.dungeon {
  padding: 15px;
  border: 3px solid #4a3a2a;
  background: #1a1a2e;
  cursor: pointer;
  transition: 0.15s;
  position: relative;
  display: flex; align-items: center; gap: 15px;
}
.dungeon:hover { background: #2a2a4e; transform: translateX(4px); }
.dungeon.completed { border-color: #7abb7a; background: #1a2a1e; }
.dungeon.completed::after { content: '✔'; color: #7abb7a; font-size: 20px; position: absolute; right: 15px; }
.dungeon.locked { opacity: 0.5; cursor: not-allowed; }
.dungeon.locked:hover { background: #1a1a2e; transform: none; }
.dungeon.current { border-color: #ffd700; animation: pulse-gold 1.5s infinite; }
@keyframes pulse-gold { 0%,100% { box-shadow: 0 0 5px #ffd70044; } 50% { box-shadow: 0 0 20px #ffd70088; } }
.dungeon .icon { font-size: 30px; }
.dungeon .info { flex: 1; }
.dungeon .name { font-size: 13px; color: #ffd700; margin-bottom: 4px; }
.dungeon .desc { font-size: 9px; color: #999; }
/* ===== 战斗画面 ===== */
#screen-battle { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
.battle-hud {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px; border: 2px solid #4a3a2a; background: #12122a; margin-bottom: 10px;
}
.battle-hud .unit { text-align: center; flex: 1; }
.battle-hud .unit .name { font-size: 11px; margin-bottom: 4px; }
.battle-hud .unit .name.enemy { color: #ff6b6b; }
.battle-hud .unit .name.player { color: #7abb7a; }
.hp-bar-outer { width: 100%; height: 12px; background: #2a1a1a; border: 2px solid #4a3a2a; }
.hp-bar-inner { height: 100%; transition: width 0.3s; }
.hp-bar-inner.enemy { background: linear-gradient(90deg, #ff4444, #ff8888); }
.hp-bar-inner.player { background: linear-gradient(90deg, #44bb44, #88ee88); }
.battle-field {
  display: flex; justify-content: space-around; align-items: center;
  padding: 20px; min-height: 140px;
  border: 2px solid #4a3a2a; background: #12122a; margin-bottom: 10px;
}
.battle-field .sprite {
  font-size: 60px; text-align: center; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
}
.vs-text { font-size: 24px; color: #ffd700; text-shadow: 2px 2px 0 #8a6a00; }
/* ===== 答题区 ===== */
.question-area {
  padding: 15px;
  border: 2px solid #4a3a2a; background: #1a1a2e; margin-bottom: 10px;
}
.question-text {
  font-size: 11px; line-height: 1.8; color: #e0d8c8; margin-bottom: 12px;
  padding: 10px; background: #0a0a1a; border: 1px solid #3a2a1a;
}
.question-text .blank { color: #ffd700; border-bottom: 2px solid #ffd700; padding: 0 4px; }
.options { display: flex; flex-direction: column; gap: 6px; }
.option-btn {
  padding: 10px 15px;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  background: #2a2a4a;
  border: 3px solid #4a3a6a;
  border-top-color: #6a5a8a;
  border-left-color: #6a5a8a;
  border-bottom-color: #2a1a3a;
  border-right-color: #2a1a3a;
  color: #e0d8c8;
  cursor: pointer;
  text-align: left;
  transition: 0.1s;
}
.option-btn:hover { background: #3a3a5a; }
.option-btn.correct { border-color: #7abb7a; background: #1a3a1a; }
.option-btn.wrong { border-color: #ff6b6b; background: #3a1a1a; }
.option-btn:disabled { opacity: 0.7; cursor: not-allowed; }
/* ===== 连击 & 技能 ===== */
.combo-display {
  text-align: center; padding: 8px;
  font-size: 14px; color: #ffd700;
  border: 2px solid #4a3a2a; background: #1a1a2e; margin-bottom: 10px;
}
.combo-display .mult { font-size: 20px; }
.skill-bar {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap;
}
.skill-btn {
  padding: 8px 12px;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  border: 2px solid #5a5a3a;
  background: #2a2a1a;
  color: #ccc;
  cursor: pointer;
}
.skill-btn.ready { border-color: #ffd700; background: #3a3a1a; color: #ffd700; }
.skill-btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* ===== 对话/日志 ===== */
.battle-log {
  padding: 10px; border: 2px solid #4a3a2a; background: #0a0a1a;
  font-size: 9px; max-height: 60px; overflow-y: auto; margin-bottom: 10px;
  color: #aaa; line-height: 1.8;
}
.battle-log .dmg { color: #ff6b6b; }
.battle-log .heal { color: #7abb7a; }
.battle-log .info { color: #7abaff; }
/* ===== 结束画面 ===== */
#screen-ending { display: none; padding: 20px; text-align: center; }
.ending-title { font-size: 24px; color: #ffd700; margin: 30px 0; }
.ending-sub { font-size: 12px; color: #ccc; line-height: 2; margin-bottom: 20px; }
/* ===== 专项训练 ===== */
#screen-practice { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
.practice-types { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; justify-content: center; }
.practice-types button { font-size: 9px; padding: 8px 12px; }
.practice-ctrl { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
/* ===== 通用 ===== */
.hidden { display: none !important; }
.mode-switch {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 15px;
}
.mode-switch button {
  padding: 8px 16px; font-family: 'Press Start 2P', monospace; font-size: 10px;
  background: #2a2a4a; border: 3px solid #4a3a6a; color: #e0d8c8; cursor: pointer;
}
.mode-switch button.active { background: #4a3a7a; border-color: #ffd700; color: #ffd700; }
.back-btn { margin-bottom: 10px; font-size: 9px; padding: 6px 12px; }
/* ===== Boss战特殊 ===== */
.boss-hearts {
  display: flex; gap: 4px; justify-content: center; margin: 8px 0;
}
.boss-heart { font-size: 20px; }
.boss-heart.lost { opacity: 0.2; }
/* ===== 错题本 ===== */
#screen-errorbook { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
.error-item {
  padding: 10px; border: 2px solid #4a3a2a; background: #1a1a2e; margin-bottom: 6px;
  font-size: 9px; line-height: 1.8;
}
.error-item .q { color: #ffd700; }
.error-item .your { color: #ff6b6b; }
.error-item .correct { color: #7abb7a; }
/* ===== 结果弹窗 ===== */
.result-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  display: none; align-items: center; justify-content: center; z-index: 50;
}
.result-overlay.show { display: flex; }
.result-box {
  padding: 30px; text-align: center; max-width: 500px;
  border: 4px solid #ffd700; background: #1a1a2e;
}
.result-box .big { font-size: 30px; margin-bottom: 15px; }
.result-box .text { font-size: 11px; line-height: 2; margin-bottom: 15px; }
/* ===== 难度指示 ===== */
.diff-indicator { font-size: 9px; padding: 3px 8px; border-radius: 0; margin-left: 5px; display: inline-block; }
.diff-easy { background: #2a5a2a; color: #7abb7a; }
.diff-medium { background: #5a5a2a; color: #ffd700; }
.diff-hard { background: #5a2a2a; color: #ff6b6b; }
/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a1a; }
::-webkit-scrollbar-thumb { background: #4a3a2a; }
/* ===== 响应式 ===== */
@media (max-width: 600px) {
  .intro-title { font-size: 18px; }
  .battle-field .sprite { font-size: 40px; }
  .option-btn { font-size: 9px; padding: 8px 10px; }
  .dungeon { padding: 10px; }
  .dungeon .icon { font-size: 24px; }
}
</style>
</head>
<body>
<!-- ===== 星空 ===== -->
<div class="stars" id="stars"></div>

<!-- ===== 开场 ===== -->
<div id="screen-intro">
  <div class="intro-title">⚔ 六级远征 ⚔</div>
  <div class="intro-sub">CET-6 勇者救公主 RPG</div>
  <div class="intro-story pixel-box">
    <p>在遥远的<em>英语王国</em>，美丽的公主正在备考六级……</p>
    <p>突然！<em>恶龙</em>从云端降临，将公主抓走！</p>
    <p>恶龙留下了诅咒：</p>
    <p style="color:#ff6b6b;margin:8px 0">"唯有穿越五大秘境、掌握六级的勇者，才有资格与我一战！"</p>
    <p>于是，我们的<em>勇者</em>踏上了征途……</p>
  </div>
  <button class="pixel-btn gold" onclick="startAdventure()" style="font-size:14px;padding:14px 30px">开始远征</button>
  <div style="margin-top:12px">
    <button class="pixel-btn" onclick="startPractice()" style="font-size:10px">专项训练模式</button>
  </div>
  <div style="margin-top:8px">
    <button class="pixel-btn" onclick="continueGame()" style="font-size:8px">读取存档</button>
    <button class="pixel-btn red" onclick="showErrorBook()" style="font-size:8px">错题本</button>
  </div>
</div>

<!-- ===== 地图 ===== -->
<div id="screen-map">
  <div class="pixel-box map-title">🏰 六级大陆 · 秘境地图</div>
  <div class="map-hud pixel-box" id="map-hud">
    <span class="hp">❤ <span id="hud-hp">30</span></span>
    <span class="lv">⭐ Lv.<span id="hud-lv">1</span></span>
    <span class="xp">✨ <span id="hud-xp">0</span>/<span id="hud-xpnext">100</span></span>
    <span class="combo">🔥 <span id="hud-combo">0</span></span>
  </div>
  <div class="mode-switch">
    <button class="active" id="btn-mode-quest" onclick="switchMode('quest')">剧情远征</button>
    <button id="btn-mode-practice" onclick="switchMode('practice')">专项训练</button>
  </div>
  <div class="dungeons" id="dungeon-list"></div>
</div>

<!-- ===== 战斗 ===== -->
<div id="screen-battle">
  <button class="pixel-btn back-btn" id="battle-back-btn" onclick="retreatBattle()">◀ 撤退</button>
  <div class="battle-hud pixel-box" id="battle-hud"></div>
  <div class="battle-field pixel-box">
    <div class="sprite" id="enemy-sprite">👾</div>
    <div class="vs-text">⚡</div>
    <div class="sprite" id="player-sprite">🧝</div>
  </div>
  <div class="combo-display pixel-box" id="combo-display">
    连击: <span class="mult" id="combo-mult">×1</span>
    <span id="combo-count" style="font-size:10px;color:#aaa;margin-left:8px">(0连)</span>
  </div>
  <div class="skill-bar" id="skill-bar">
    <button class="skill-btn" id="skill-double" onclick="useSkill('double')" disabled>⚡ 双倍分数</button>
    <button class="skill-btn" id="skill-shield" onclick="useSkill('shield')" disabled>🛡 免死金牌</button>
    <button class="skill-btn" id="skill-skip" onclick="useSkill('skip')" disabled>⏸ 跳过此题</button>
  </div>
  <div class="question-area pixel-box">
    <div id="question-type" style="font-size:9px;color:#7abaff;margin-bottom:6px"></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-area"></div>
  </div>
  <div class="battle-log pixel-box" id="battle-log">旅行者，做好准备……</div>
  <div style="text-align:center;margin-top:8px">
    <span id="progress-indicator" style="font-size:9px;color:#999">第 1/10 题</span>
  </div>
</div>

<!-- ===== 专项训练 ===== -->
<div id="screen-practice">
  <div class="pixel-box" style="padding:15px;margin-bottom:15px">
    <div style="font-size:12px;color:#ffd700;text-align:center;margin-bottom:10px">🏋 专项训练</div>
    <div class="practice-types">
      <button class="pixel-btn" onclick="startPracticeType('vocab')">📖 词汇选择</button>
      <button class="pixel-btn" onclick="startPracticeType('cloze')">✏️ 选词填空</button>
      <button class="pixel-btn" onclick="startPracticeType('trans')">🌐 中译英</button>
      <button class="pixel-btn" onclick="startPracticeType('reading')">📄 阅读理解</button>
    </div>
  </div>
  <div class="question-area pixel-box" id="practice-question-area" style="display:none">
    <div id="practice-question-type" style="font-size:9px;color:#7abaff;margin-bottom:6px"></div>
    <div class="question-text" id="practice-question-text"></div>
    <div class="options" id="practice-options-area"></div>
  </div>
  <div class="practice-ctrl" id="practice-ctrl" style="display:none">
    <button class="pixel-btn" onclick="practiceNext()">下一题 →</button>
    <button class="pixel-btn gold" onclick="showAnswer()">显示答案 🔍</button>
  </div>
  <div class="battle-log pixel-box" id="practice-log" style="display:none"></div>
  <div style="text-align:center;margin-top:10px">
    <button class="pixel-btn" onclick="goToMap()" style="font-size:9px">返回地图</button>
  </div>
</div>

<!-- ===== 错题本 ===== -->
<div id="screen-errorbook">
  <div class="pixel-box" style="padding:15px;margin-bottom:15px">
    <div style="font-size:12px;color:#ffd700;text-align:center;margin-bottom:10px">📕 错题本</div>
    <div id="error-list"></div>
  </div>
  <div style="text-align:center">
    <button class="pixel-btn red" onclick="clearErrors()" style="font-size:9px">清空错题本</button>
    <button class="pixel-btn" onclick="goToMap()" style="font-size:9px;margin-left:8px">返回</button>
  </div>
</div>

<!-- ===== 结束画面 ===== -->
<div id="screen-ending">
  <div class="ending-title">🎉 恭喜通关！🎉</div>
  <div class="ending-sub pixel-box" style="padding:30px;max-width:600px;margin:0 auto">
    <p style="font-size:40px;margin-bottom:20px">👸</p>
    <p>勇者击败了恶龙，救出了公主！</p>
    <p>公主微笑着说：</p>
    <p style="color:#ffd700;margin:10px 0">"谢谢你，勇者。你的六级……过了！"</p>
    <p style="font-size:9px;color:#999;margin-top:20px">—— 六级远征 · 完 ——</p>
  </div>
  <div style="margin-top:20px">
    <button class="pixel-btn gold" onclick="resetGame()" style="font-size:12px">再来一次 🔄</button>
    <button class="pixel-btn" onclick="goToMap()" style="font-size:10px;margin-left:8px">返回地图</button>
  </div>
</div>

<!-- ===== 结果弹窗 ===== -->
<div class="result-overlay" id="result-overlay">
  <div class="result-box pixel-box">
    <div class="big" id="result-icon">🏆</div>
    <div class="text" id="result-text"></div>
    <button class="pixel-btn gold" onclick="closeResult()">确定</button>
  </div>

 with environmental protection and social equity. The transition to renewable energy sources, such as solar and wind power, is a key component of this effort. Additionally, the concept of a circular economy, which emphasizes recycling and reducing waste, is gaining traction. International agreements, such as the Paris Agreement, provide a framework for global cooperation on climate action. However, achieving sustainability goals requires not only technological innovation but also changes in individual behavior and collective responsibility. The path to a sustainable future is challenging, but the commitment to action has never been stronger.", "questions": [["What is the main challenge discussed in the passage?", ["Economic growth", "Climate change", "Technological innovation", "Social equity"], 1], ["What is a key component of the transition to sustainability?", ["Fossil fuels", "Renewable energy", "Nuclear power", "Deforestation"], 1], ["What does the circular economy emphasize?", ["More production", "Recycling and waste reduction", "Increased consumption", "Faster growth"], 1], ["What is needed to achieve sustainability goals?", ["Only technology", "Only government action", "Both innovation and behavior change", "More natural resources"], 2]]}, {"title": "缃戠粶鏃朵唬鐨勯殣绉佷繚鎶?, "text": "In the digital age, personal privacy has become an increasingly important concern. With the explosion of social media, e-commerce, and online services, vast amounts of personal data are being collected, stored, and analyzed by companies and governments alike. While this data enables personalized services and improved user experiences, it also raises serious questions about privacy and security. Data breaches have exposed the personal information of millions of users, leading to identity theft and financial fraud. In response, many countries have enacted data protection laws, such as the European Union's General Data Protection Regulation (GDPR) and China's Personal Information Protection Law. These regulations require companies to be transparent about how they collect and use data, and give individuals more control over their personal information. However, as technology continues to advance, the balance between convenience and privacy remains a delicate one.", "questions": [["What is the main concern raised in the passage?", ["Online shopping", "Personal privacy in the digital age", "Social media usage", "E-commerce growth"], 1], ["What has data breaches led to?", ["Improved security", "Identity theft and fraud", "More online services", "Better user experience"], 1], ["What do data protection laws require from companies?", ["Collect more data", "Be transparent about data usage", "Share data with other companies", "Reduce online services"], 1], ["What remains a challenge according to the passage?", ["Balancing convenience and privacy", "Developing new technology", "Reducing data collection", "Enhancing user experience"], 0]]}, {"title": "涓浗缁忔祹浠庨珮閫熷埌楂樿川閲忓彂灞?, "text": "For decades, China's economy grew at an impressive double-digit rate, lifting hundreds of millions out of poverty and transforming the country into the world's second-largest economy. However, in recent years, China has shifted its focus from high-speed growth to high-quality development, prioritizing sustainability, innovation, and balanced growth over sheer speed. This new approach emphasizes green development, technological self-sufficiency, and the reduction of income inequality. Key initiatives include the dual circulation strategy, which strengthens both domestic consumption and international trade, and the push for innovation in critical technologies such as semiconductors and AI. The transition has not been without challenges, including a slowing property market and demographic pressures from an aging population. Nonetheless, China's commitment to high-quality development reflects a maturing economy that seeks long-term stability and prosperity.", "questions": [["What is China's current economic focus?", ["High-speed growth", "High-quality development", "International expansion", "Industrialization"], 1], ["What does the dual circulation strategy involve?", ["Only domestic market", "Both domestic and international markets", "Only international trade", "Only consumption"], 1], ["What challenge does China face in this transition?", ["A booming property market", "A slowing property market and aging population", "Rapid population growth", "Excessive innovation"], 1], ["What is emphasized under high-quality development?", ["Speed above all", "Green development and innovation", "International expansion", "Industrial output"], 1]]}, {"title": "鏂拌兘婧愭苯杞︾殑闈╁懡", "text": "The global automotive industry is undergoing a profound transformation, driven by the shift from internal combustion engines to electric vehicles (EVs). China has emerged as the world's largest EV market, with companies like BYD and NIO leading the charge. Government policies, including purchase subsidies and license plate incentives, have accelerated adoption. Beyond environmental benefits, EVs offer lower operating costs and greater energy efficiency. However, challenges persist, including the need for extensive charging infrastructure, battery range anxiety, and the environmental impact of battery production and disposal. The development of solid-state batteries and battery recycling technologies promises to address some of these issues. As more countries announce plans to phase out gasoline vehicles, the electric vehicle revolution is set to reshape not only transportation but also energy grids and urban planning.", "questions": [["What is driving the transformation of the automotive industry?", ["Government policies only", "The shift to electric vehicles", "Consumer demand only", "Fuel prices"], 1], ["What challenge does EV adoption face?", ["Excessive charging stations", "Battery range anxiety and limited charging infrastructure", "High fuel costs", "Too many models"], 1], ["What technology could address battery concerns?", ["Gasoline engines", "Solid-state batteries", "Faster cars", "Lighter vehicles"], 1], ["What is NOT mentioned as a benefit of EVs?", ["Lower operating costs", "Energy efficiency", "Reduced air pollution", "Lower purchase price"], 3]]}, {"title": "鏁板瓧缁忔祹鐨勫礇璧蜂笌鎸戞垬", "text": "The digital economy, characterized by the use of digital technologies to create value, has become a major driver of global economic growth. From e-commerce and digital payments to cloud computing and artificial intelligence, digital technologies are transforming how businesses operate and how people live. China is at the forefront of this revolution, with platforms like Alibaba, Tencent, and ByteDance leading innovation. The sharing economy, live-streaming e-commerce, and mobile payments have become integral parts of daily life. However, the rapid growth of the digital economy also presents challenges, including data security risks, monopolistic practices by large platforms, and the widening digital divide between urban and rural areas. Policymakers are grappling with how to regulate the digital economy effectively while fostering innovation. The future of the digital economy will depend on finding the right balance between growth and governance.", "questions": [["What is the digital economy characterized by?", ["Traditional manufacturing", "Using digital technologies to create value", "Agricultural production", "Physical retail"], 1], ["Which country is at the forefront of the digital revolution?", ["The United States", "China", "Japan", "Germany"], 1], ["What challenge does the digital economy face?", ["Too much competition", "Data security risks and monopolistic practices", "Lack of innovation", "Too many regulations"], 1], ["What will the future of the digital economy depend on?", ["More data collection", "Balancing growth and governance", "Eliminating all platforms", "Returning to traditional commerce"], 1]]}, {"title": "绮瀹夊叏涓庡啘涓氱幇浠ｅ寲", "text": "Food security remains a fundamental concern for every nation, particularly in the face of climate change, population growth, and geopolitical tensions. China, with its vast population, has made significant strides in ensuring food self-sufficiency through agricultural modernization. The adoption of smart farming technologies, including drone-based crop monitoring, precision irrigation, and AI-powered pest detection, has dramatically improved agricultural productivity. Additionally, the development of high-yield crop varieties through genetic research has helped stabilize food production. The concept of 'storing grain in the land and in technology' guides China's agricultural strategy. However, challenges such as soil degradation, water scarcity, and the need to reduce the carbon footprint of agriculture remain. Sustainable farming practices and technological innovation will be crucial for ensuring long-term food security.", "questions": [["What is the main concern discussed in the passage?", ["Urban development", "Food security", "Transportation", "Manufacturing"], 1], ["How has China improved agricultural productivity?", ["By reducing farmland", "Through smart farming technologies", "By importing more food", "By reducing crop varieties"], 1], ["What is part of China's agricultural strategy?", ["Storing grain in cities", "Storing grain in the land and in technology", "Reducing agricultural research", "Importing all food"], 1], ["What challenge remains for sustainable agriculture?", ["Excessive rainfall", "Soil degradation and water scarcity", "Too much farmland", "Low food demand"], 1]]}, {"title": "寰敓鐗╃兢钀戒笌浜轰綋鍋ュ悍", "text": "The human microbiome, the vast collection of microorganisms living in and on our bodies, has emerged as a crucial factor in human health and disease. These tiny organisms, including bacteria, viruses, and fungi, play essential roles in digestion, immune function, and even mental health. Recent scientific research has revealed that the composition of our gut microbiome is influenced by diet, lifestyle, and environmental factors. An imbalance in the microbiome has been linked to various conditions, including obesity, diabetes, inflammatory bowel disease, and depression. Probiotics and prebiotics have gained popularity as ways to promote a healthy microbiome. The growing field of microbiome research holds promise for developing new therapeutic approaches, such as fecal microbiota transplantation. However, much remains to be understood about the complex interactions between our bodies and the trillions of microbes we host.", "questions": [["What is the human microbiome?", ["A type of medicine", "Microorganisms in and on our bodies", "A new disease", "A diet plan"], 1], ["What influences the composition of gut microbiome?", ["Only genetics", "Diet, lifestyle, and environment", "Only age", "Only medication"], 1], ["What conditions have been linked to microbiome imbalance?", ["Only digestion issues", "Obesity, diabetes, and depression", "Only mental health", "Only physical health"], 1], ["What is a potential new therapy from microbiome research?", ["Antibiotics", "Fecal microbiota transplantation", "Surgery", "Vaccination"], 1]]}, {"title": "鑸ぉ鎺㈢储涓庣鎶€鍙戝睍", "text": "Space exploration represents one of humanity's greatest endeavors, pushing the boundaries of scientific knowledge and technological capability. China's space program has achieved remarkable milestones, including the Chang'e lunar missions, the construction of the Tiangong space station, and the successful landing of the Zhurong rover on Mars. These achievements not only demonstrate technological prowess but also contribute to scientific research in fields such as astronomy, materials science, and biology. Moreover, space technology has numerous practical applications on Earth, from satellite-based communications and weather forecasting to navigation systems. The commercialization of space, with private companies entering the sector, is opening new possibilities for space tourism and resource utilization. International cooperation remains important despite geopolitical tensions, as space exploration requires enormous resources and expertise that no single nation possesses alone.", "questions": [["What has China achieved in space exploration?", ["Only satellite launches", "Lunar missions, space station, and Mars rover", "Only Mars exploration", "Only space station"], 1], ["How does space technology benefit Earth?", ["Only for entertainment", "Communications, weather forecasting, and navigation", "Only for military use", "Only for research"], 1], ["What is a new trend in the space sector?", ["Government-only control", "Commercialization and private company involvement", "Ending all space programs", "Reducing international cooperation"], 1], ["Why is international cooperation important in space?", ["It is optional", "Space requires enormous resources and expertise", "One nation can do everything", "It reduces competition"], 1]]}, {"title": "闈掑勾灏变笟涓庤亴涓氬彂灞?, "text": "Youth employment has become a pressing issue worldwide, with young people facing unique challenges in an increasingly competitive job market. The rapid pace of technological change is reshaping industries and creating new types of jobs while making others obsolete. Educational institutions are under pressure to adapt their curricula to prepare students for the demands of the modern workplace. Skills such as critical thinking, digital literacy, and emotional intelligence are increasingly valued alongside traditional academic knowledge. Internships and vocational training programs provide valuable practical experience. Meanwhile, the gig economy and remote work offer flexible alternatives to traditional employment. Government policies, including job creation programs and entrepreneurship support, play a crucial role in addressing youth unemployment. Ultimately, success in the modern job market requires adaptability, continuous learning, and a proactive approach to career development.", "questions": [["What is the main challenge discussed for youth?", ["Too many choices", "Youth employment in a competitive market", "Lack of education", "Easy job market"], 1], ["What skills are increasingly valued in the workplace?", ["Only academic knowledge", "Critical thinking, digital literacy, and emotional intelligence", "Only physical strength", "Only technical skills"], 1], ["What provides practical experience for young people?", ["Only university courses", "Internships and vocational training", "Only online courses", "Only textbooks"], 1], ["What helps address youth unemployment according to the passage?", ["Government job creation programs and entrepreneurship support", "Waiting for the economy to improve", "Reducing education", "Eliminating technology"], 0]]}, {"title": "浼犵粺鏂囧寲涓庣幇浠ｇぞ浼氱殑浜よ瀺", "text": "In an era of rapid globalization and technological advancement, traditional culture faces both challenges and opportunities. In China, there has been a resurgence of interest in traditional culture, particularly among young people. Hanfu, traditional Chinese clothing, has become a fashion trend, while ancient poetry and classical music are being reinterpreted for modern audiences. The integration of traditional elements into modern design, entertainment, and education reflects a broader cultural renaissance. Digital technology has played a significant role in this revival, making classical texts and artworks more accessible online. Museums have digitized their collections, and virtual reality allows people to 'visit' historical sites from home. However, the preservation of intangible cultural heritage, such as traditional crafts and performing arts, remains a challenge. The key lies in adapting traditions to contemporary contexts while preserving their essence.", "questions": [["What trend is observed among young Chinese people?", ["Rejecting all tradition", "Growing interest in traditional culture", "Preferring only Western culture", "Ignoring cultural heritage"], 1], ["How has technology helped cultural revival?", ["By replacing tradition", "By making classical works more accessible online", "By eliminating traditional crafts", "By discouraging cultural learning"], 1], ["What challenge remains for cultural heritage?", ["Too much interest", "Preserving intangible cultural heritage", "Easy preservation", "Excessive funding"], 1], ["What is the key to preserving traditional culture?", ["Keeping it unchanged", "Adapting traditions to contemporary contexts", "Only preserving in museums", "Ignoring modern influences"], 1]]}, {"title": "閲戣瀺绉戞妧涓庢櫘鎯犻噾铻?, "text": "Financial technology, or fintech, has revolutionized the banking and financial services industry, making financial services more accessible, efficient, and affordable. In China, mobile payment platforms like Alipay and WeChat Pay have achieved near-universal adoption, transforming the way people conduct transactions. Blockchain technology is being explored for applications beyond cryptocurrencies, including supply chain finance and digital identity verification. Peer-to-peer lending and crowdfunding platforms have opened new avenues for fundraising, particularly for small businesses and startups. Robo-advisors provide automated investment advice at a fraction of the cost of traditional financial advisors. However, the rapid growth of fintech also brings regulatory challenges, including concerns about consumer protection, data privacy, and systemic risk. The concept of inclusive finance, or making financial services available to underserved populations, remains a key objective of fintech innovation.", "questions": [["What has fintech done for financial services?", ["Made them less accessible", "Made them more accessible and affordable", "Only helped large banks", "Reduced innovation"], 1], ["What mobile payment platforms are mentioned for China?", ["Only Alipay", "Alipay and WeChat Pay", "Only WeChat Pay", "Only Apple Pay"], 1], ["What is a regulatory challenge of fintech?", ["Too many users", "Consumer protection and data privacy concerns", "Lack of competition", "Excessive regulation"], 1], ["What is a key objective of fintech innovation?", ["Serving only large companies", "Inclusive finance for underserved populations", "Reducing all financial services", "Eliminating traditional banking"], 1]]}, {"title": "鍏ㄧ悆姘斿€欏彉鍖栦笌纰冲噺鎺掕鍔?, "text": "Global climate change represents an existential threat that requires unprecedented international cooperation. The scientific consensus is clear: human activities, particularly the burning of fossil fuels, are causing global temperatures to rise at an alarming rate. The consequences include more frequent and severe natural disasters, rising sea levels, and disruptions to ecosystems and agriculture. In response, countries have set ambitious targets for reducing greenhouse gas emissions. The Paris Agreement, signed by nearly 200 nations, provides a framework for these efforts. China has committed to reaching peak carbon emissions by 2030 and achieving carbon neutrality by 2060. These targets require a fundamental transformation of the energy system, shifting from coal to renewable sources, improving energy efficiency, and promoting low-carbon technologies. Carbon pricing mechanisms, such as emissions trading systems, are being implemented to incentivize emission reductions. While the challenges are daunting, the transition to a low-carbon economy also presents opportunities for innovation and economic growth.", "questions": [["What is the main cause of global warming according to the passage?", ["Natural cycles", "Burning fossil fuels", "Volcanic eruptions", "Solar activity"], 1], ["What are the consequences of rising temperatures?", ["Only economic impacts", "Natural disasters and rising sea levels", "Only agricultural changes", "Only weather changes"], 1], ["What is China's carbon neutrality target year?", ["2030", "2060", "2050", "2040"], 1], ["What are carbon pricing mechanisms designed to do?", ["Only raise government revenue", "Incentivize emission reductions", "Penalize all industries", "Slow economic growth"], 1]]}, {"title": "鍏ㄧ悆渚涘簲閾剧殑闊ф€т笌閲嶆瀯", "text": "The COVID-19 pandemic exposed the fragility of global supply chains, causing disruptions across industries from automotive to electronics. Factory shutdowns, shipping bottlenecks, and labor shortages revealed the risks of over-reliance on single-source suppliers and just-in-time inventory systems. In response, companies are rethinking their supply chain strategies, emphasizing resilience over cost efficiency. This has led to trends such as near-shoring, where production is moved closer to end markets, and multi-sourcing, where companies diversify their supplier base. Digital technologies, including blockchain for traceability and AI for demand forecasting, are being deployed to enhance supply chain visibility and responsiveness. Governments are also taking action, with many countries seeking to strengthen domestic manufacturing capacity in critical sectors like semiconductors and medical supplies. While these changes may increase costs in the short term, they aim to build more robust and adaptable supply networks for the future.", "questions": [["What exposed the fragility of global supply chains?", ["Trade wars", "The COVID-19 pandemic", "Technological change", "Natural disasters"], 1], ["What is near-shoring?", ["Producing in distant countries", "Moving production closer to end markets", "Reducing all production", "Increasing inventory"], 1], ["What technology helps enhance supply chain visibility?", ["Only GPS", "Blockchain and AI", "Only manual tracking", "Only barcodes"], 1], ["What is the short-term cost of these changes?", ["Lower efficiency", "Increased costs", "Reduced quality", "Slower delivery"], 1]]}, {"title": "娴锋磱淇濇姢涓庤摑鑹茬粡娴?, "text": "The world's oceans cover over 70% of the Earth's surface and play a vital role in regulating the climate, producing oxygen, and supporting biodiversity. However, marine ecosystems are under severe threat from pollution, overfishing, and climate change. Plastic pollution has become a particularly visible crisis, with millions of tons of plastic entering the ocean each year, harming marine life and entering the food chain. In response, the concept of the blue economy has gained prominence, emphasizing the sustainable use of ocean resources for economic growth while preserving marine ecosystems. This includes sectors such as sustainable fisheries, marine renewable energy, ocean tourism, and biotechnology. International efforts, such as the United Nations' Sustainable Development Goal 14, aim to conserve and sustainably use the oceans. China has implemented a fishing moratorium and established marine protected areas. Individual actions, such as reducing plastic use, also contribute to ocean conservation.", "questions": [["What percentage of the Earth's surface do oceans cover?", ["50%", "70%", "60%", "80%"], 1], ["What is a major threat to marine ecosystems?", ["Too much tourism", "Plastic pollution and overfishing", "Excessive marine parks", "Lack of fishing"], 1], ["What does the 'blue economy' emphasize?", ["Maximum resource extraction", "Sustainable use of ocean resources", "Unlimited fishing", "Oil exploration"], 1], ["What has China done to protect oceans?", ["Encouraged more fishing", "Implemented fishing moratorium", "Reduced marine reserves", "Promoted offshore drilling"], 1]]}, {"title": "鍙啀鐢熻兘婧愮殑鏈潵鍓嶆櫙", "text": "The transition from fossil fuels to renewable energy is accelerating worldwide, driven by declining costs, technological improvements, and policy support. Solar and wind power have become the cheapest sources of electricity in many parts of the world, leading to rapid deployment. China leads the world in renewable energy capacity, with massive investments in solar, wind, and hydroelectric power. Energy storage technology, particularly lithium-ion batteries, has advanced significantly, addressing the intermittency challenge of renewables. Green hydrogen produced from renewable sources is emerging as a solution for hard-to-decarbonize sectors such as heavy industry and long-distance transportation. However, challenges remain, including grid integration, land use requirements, and the need for critical minerals for renewable technologies. The global push for net-zero emissions means that the renewable energy transition is not just an environmental imperative but also an economic opportunity, creating millions of jobs worldwide.", "questions": [["What is driving the transition to renewable energy?", ["Only environmental concerns", "Declining costs and policy support", "Only government mandates", "Only technological changes"], 1], ["What country leads in renewable energy capacity?", ["The United States", "China", "Germany", "India"], 1], ["What technology addresses the intermittency of renewables?", ["More fossil fuels", "Energy storage like lithium-ion batteries", "Nuclear power", "Diesel generators"], 1], ["What is green hydrogen used for?", ["Only power generation", "Hard-to-decarbonize sectors like heavy industry", "Only transportation", "Only heating"], 1]]}, {"title": "鏂囧寲閬椾骇淇濇姢涓庢椿鍖栧埄鐢?, "text": "Cultural heritage, both tangible and intangible, is an invaluable asset that connects us to our past and shapes our identity. In China, the protection of cultural heritage has gained increasing attention, with significant investments in the restoration of historical sites and the preservation of traditional crafts. The concept of 'activating' heritage has emerged, emphasizing that preservation should not mean turning cultural assets into static museum pieces. Instead, heritage should be integrated into modern life through creative adaptation. For instance, ancient buildings have been repurposed as cultural spaces and boutique hotels, while traditional crafts have been given new life through contemporary design. Digital technology plays a crucial role in this process, with 3D scanning and virtual reality enabling people to explore historical sites remotely. However, balancing conservation with development remains a challenge, particularly in rapidly urbanizing areas. The key is to ensure that heritage protection and economic development reinforce rather than compete with each other.", "questions": [["What does 'activating' heritage mean?", ["Destroying old buildings", "Integrating heritage into modern life", "Only preserving in museums", "Selling heritage items"], 1], ["How are traditional crafts being revitalized?", ["Through mass production", "Through contemporary design", "By keeping them unchanged", "By exporting them"], 1], ["What technology helps people explore heritage sites?", ["Only photography", "3D scanning and virtual reality", "Only written descriptions", "Only audio recordings"], 1], ["What is the challenge in heritage protection?", ["Too much funding", "Balancing conservation with development", "Lack of interest", "Too many tourists"], 1]]}, {"title": "鎯呯华鏅哄姏涓庤亴鍦烘垚鍔?, "text": "Emotional intelligence (EQ), the ability to recognize, understand, and manage one's own emotions and those of others, has emerged as a critical factor for success in the modern workplace. While technical skills may get you hired, emotional intelligence often determines career advancement. Research has shown that individuals with high EQ tend to perform better in leadership roles, collaborate more effectively in teams, and navigate workplace challenges with greater ease. Key components of emotional intelligence include self-awareness, self-regulation, empathy, and social skills. In an era of increasing automation and artificial intelligence, uniquely human skills like empathy and emotional connection become even more valuable. Organizations are recognizing this and incorporating EQ assessment into hiring and promotion decisions. Fortunately, unlike IQ, emotional intelligence can be developed and improved through conscious practice and feedback.", "questions": [["What is emotional intelligence?", ["Technical knowledge", "Managing emotions of oneself and others", "Physical ability", "Academic skill"], 1], ["What determines career advancement according to the passage?", ["Only technical skills", "Often emotional intelligence", "Only experience", "Only education"], 1], ["What are key components of EQ?", ["Physical strength and speed", "Self-awareness, empathy, and social skills", "Technical expertise and certification", "Academic qualifications"], 1], ["Can emotional intelligence be improved?", ["No, it's fixed", "Yes, through conscious practice", "Only in childhood", "Only through medication"], 1]]}, {"title": "閲忓瓙璁＄畻鐨勫墠娌跨獊鐮?, "text": "Quantum computing represents a fundamental departure from classical computing, harnessing the principles of quantum mechanics to process information in entirely new ways. While classical computers use bits that represent either 0 or 1, quantum computers use quantum bits or qubits that can exist in multiple states simultaneously, enabling them to solve certain types of problems exponentially faster. Potential applications include drug discovery, materials science, cryptography, and optimization problems. China has made significant investments in quantum research, achieving milestones such as quantum communication satellites and quantum computing prototypes. However, the field faces substantial technical challenges, including qubit stability and error correction. Most experts believe that practical, large-scale quantum computers are still years away. Nevertheless, the race to achieve quantum supremacy has intensified global competition and collaboration in this cutting-edge field.", "questions": [["How do qubits differ from classical bits?", ["They are larger", "They can exist in multiple states simultaneously", "They use more energy", "They are slower"], 1], ["What is a potential application of quantum computing?", ["Social media", "Drug discovery and cryptography", "Email", "Web browsing"], 1], ["What technical challenge does quantum computing face?", ["Cost only", "Qubit stability and error correction", "Size only", "Speed only"], 1], ["When will practical quantum computers be available?", ["Already available", "Still years away", "Next month", "Never"], 1]]}, {"title": "绮惧噯鎵惰传鍒颁埂鏉戞尟鍏?, "text": "China's poverty alleviation efforts have achieved historic success, lifting nearly 100 million people out of poverty in the past decade. The targeted poverty alleviation strategy, which involved precise identification of poor households, tailored assistance measures, and rigorous evaluation, has been widely recognized as an effective approach. Building on this foundation, the focus has now shifted to rural revitalization, a comprehensive strategy to develop rural areas economically, socially, and environmentally. Key priorities include modernizing agriculture, improving rural infrastructure, protecting the ecological environment, and promoting cultural prosperity in the countryside. E-commerce has opened new markets for agricultural products, while rural tourism has created alternative income sources. Challenges remain, including preventing a return to poverty, addressing the urban-rural income gap, and encouraging young people to stay in or return to rural areas. The transition from poverty alleviation to rural revitalization represents a new phase in China's rural development.", "questions": [["How many people did China lift out of poverty?", ["10 million", "Nearly 100 million", "50 million", "1 billion"], 1], ["What did targeted poverty alleviation involve?", ["Uniform assistance", "Precise identification and tailored measures", "Only cash handouts", "Relocation of all poor"], 1], ["What has shifted to after poverty alleviation?", ["Urban development", "Rural revitalization", "Industrial expansion", "International aid"], 1], ["What challenge remains for rural development?", ["Too much progress", "Preventing return to poverty and income gap", "Lack of agricultural products", "Excessive rural tourism"], 1]]}, {"title": "鏁板瓧璐у竵涓庢敮浠樻柟寮忓彉闈?, "text": "The rise of digital currencies is reshaping the global financial landscape. Central bank digital currencies (CBDCs), such as China's digital yuan (e-CNY), represent a new form of digital money issued by central banks, combining the convenience of digital payments with the security of sovereign currency. The digital yuan has been piloted in numerous Chinese cities, used for everything from public transportation to retail purchases. Unlike decentralized cryptocurrencies like Bitcoin, CBDCs are controlled by central banks, offering greater stability and regulatory oversight. The potential benefits include more efficient payment systems, improved financial inclusion, and enhanced ability to implement monetary policy. However, concerns about privacy, data security, and the impact on the traditional banking system need to be addressed. As more countries explore CBDCs, the competition to establish digital currency standards has intensified, with implications for the future of international trade and finance.", "questions": [["What is China's CBDC called?", ["WeChat Pay", "Digital yuan or e-CNY", "Bitcoin", "Alipay"], 1], ["How do CBDCs differ from cryptocurrencies like Bitcoin?", ["They are the same", "CBDCs are controlled by central banks", "CBDCs are decentralized", "CBDCs are anonymous"], 1], ["What is a benefit of CBDCs?", ["Complete anonymity", "More efficient payment systems", "No government control", "No transaction records"], 1], ["What concern does the passage mention about CBDCs?", ["Too many users", "Privacy and data security concerns", "Excessive regulation", "Lack of interest"], 1]]}, {"title": "鑰侀緞鍖栫ぞ浼氫笌閾跺彂缁忔祹", "text": "Population aging is a global phenomenon, with profound implications for economies and societies. China's population is aging rapidly, with the proportion of people aged 60 and above expected to reach 30% by 2035. This demographic shift presents both challenges and opportunities. On the challenge side, a shrinking workforce and increasing pressure on pension and healthcare systems require policy adaptation. The government has responded by gradually raising the retirement age, improving the social security system, and promoting the three-child policy. On the opportunity side, the 'silver economy' 鈥?products and services catering to older adults 鈥?is experiencing rapid growth. This includes sectors such as healthcare, elderly care facilities, financial services for seniors, and age-friendly technology. Smart home devices, health monitoring systems, and online medical consultations are making aging at home more feasible. The key challenge is to create a society where older adults can live with dignity, security, and fulfillment.", "questions": [["What percentage of China's population will be 60+ by 2035?", ["20%", "30%", "40%", "50%"], 1], ["What is the 'silver economy'?", ["A type of precious metal", "Products and services for older adults", "An economic recession", "A new currency"], 1], ["What policy has China introduced to address demographic challenges?", ["One-child policy", "Three-child policy", "No-child policy", "Immigration only"], 1], ["What technology helps older adults?", ["Only smartphones", "Smart home devices and health monitoring", "Only video games", "Only social media"], 1]]}, {"title": "璺ㄦ枃鍖栨矡閫氫笌鍥介檯鍚堜綔", "text": "In an increasingly interconnected world, cross-cultural communication skills have become essential for international cooperation and business success. Understanding cultural differences in communication styles, business etiquette, and social norms can make the difference between successful partnerships and costly misunderstandings. For example, while Western cultures often value direct communication, many Asian cultures prefer a more indirect approach. The concept of 'face' plays a significant role in Chinese business culture. Language barriers, while important, are only one aspect of cross-cultural communication. Non-verbal cues, attitudes toward time, and approaches to negotiation also vary significantly across cultures. Effective cross-cultural communicators demonstrate cultural humility, active listening, and adaptability. As Chinese companies expand globally, the ability to navigate cultural differences has become a valuable competitive advantage. International education and exchange programs play a crucial role in fostering cross-cultural understanding.", "questions": [["Why are cross-cultural communication skills important?", ["Only for travel", "For international cooperation and business success", "Only for language learning", "Only for diplomacy"], 1], ["How do Western and Asian communication styles differ?", ["They are the same", "Western cultures prefer direct communication, Asian cultures more indirect", "Asian cultures are more direct", "No difference exists"], 1], ["What is 'face' in Chinese business culture?", ["Physical appearance", "Social standing and reputation", "Facial expressions", "Direct communication"], 1], ["What helps foster cross-cultural understanding?", ["Only business travel", "International education and exchange programs", "Only language courses", "Only online communication"], 1]]}, {"title": "鐢熺墿澶氭牱鎬т笌鐢熸€佺郴缁熶繚鎶?, "text": "Biodiversity, the variety of life on Earth across all levels of biological organization, is essential for ecosystem health and human well-being. It provides clean air and water, pollinates crops, regulates climate, and supplies food and medicine. However, biodiversity is declining at an alarming rate due to habitat destruction, climate change, pollution, and overexploitation of species. The UN Convention on Biological Diversity has set targets to protect 30% of land and sea areas by 2030. China has established an extensive system of nature reserves and national parks, and has implemented the Yangtze River fishing ban to restore aquatic ecosystems. // ===== 实用工具 =====
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(a) { for(let i=a.length-1; i>0; i--) { const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function $(id) { return document.getElementById(id); }

// ===== 星空 =====
(function() {
  const c = $('stars');
  for(let i=0;i<80;i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = rand(0,100)+'%';
    s.style.top = rand(0,100)+'%';
    s.style.animationDelay = (Math.random()*2)+'s';
    s.style.animationDuration = (1.5+Math.random()*2)+'s';
    c.appendChild(s);
  }
})();

// ===== 屏幕管理 =====
function showScreen(id) {
  ['screen-intro','screen-map','screen-battle','screen-ending','screen-practice','screen-errorbook'].forEach(s => {
    $(s).style.display = s === id ? '' : 'none';
  });
}

// ===== 渲染地图 =====
function renderMap() {
  const list = $('dungeon-list');
  let html = '';
  DUNGEONS.forEach((d, i) => {
    const completed = G.completedDungeons.includes(i);
    const locked = i > 0 && !G.completedDungeons.includes(i-1) && !completed;
    const current = !completed && !locked && (i === 0 || G.completedDungeons.includes(i-1));
    let cls = 'dungeon pixel-box';
    if (completed) cls += ' completed';
    if (locked) cls += ' locked';
    if (current) cls += ' current';
    const onclick = locked ? '' : `onclick="enterDungeon(${i})"`;
    html += `<div class="${cls}" ${onclick}>
      <div class="icon">${d.icon}</div>
      <div class="info">
        <div class="name">${d.name} ${completed ? '(已通过)' : ''}</div>
        <div class="desc">${d.desc}</div>
      </div>
    </div>`;
  });
  list.innerHTML = html;
  updateHUD();
}

function updateHUD() {
  $('hud-hp').textContent = G.hp;
  $('hud-lv').textContent = G.lv;
  $('hud-xp').textContent = G.xp;
  $('hud-xpnext').textContent = G.xpNext;
  $('hud-combo').textContent = G.combo;
}

// ===== 进入秘境/战斗 =====
function enterDungeon(idx) {
  G.currentDungeon = idx;
  G.currentQuestion = 0;
  G.combo = 0;
  G.shieldActive = false;
  
  if (idx === 5) {
    // Boss战
    G.bossPhase = 0;
    G.questionsTotal = 15;
  } else {
    G.questionsTotal = 10;
  }
  
  generateQuestions(idx);
  startBattle();
}

function generateQuestions(idx) {
  const dungeon = DUNGEONS[idx];
  const qs = [];
  
  if (idx === 5) {
    // Boss: mixed types, more difficult
    for(let i=0; i<15; i++) {
      const type = ['vocab','cloze','trans','reading'][rand(0,3)];
      const q = generateOneQuestion(type, 2); // hard difficulty
      if (q) qs.push(q);
    }
  } else {
    const type = dungeon.type;
    const diff = type === 'vocab' ? G.diffLevel.vocab :
                 type === 'cloze' ? G.diffLevel.cloze :
                 type === 'trans' ? G.diffLevel.trans : G.diffLevel.reading;
    for(let i=0; i<10; i++) {
      const q = generateOneQuestion(type, diff);
      if (q) qs.push(q);
    }
  }
  
  G.questions = shuffle(qs);
  G.questionIndex = 0;
}

function generateOneQuestion(type, diff) {
  diff = diff || 0;
  
  if (type === 'vocab') {
    if (!VOCAB.length) return null;
    return generateVocabQuestion(diff);
  } else if (type === 'cloze') {
    if (!CLOZE.length) return null;
    return generateClozeQuestion(diff);
  } else if (type === 'trans') {
    if (!TRANS.length) return null;
    return generateTransQuestion(diff);
  } else if (type === 'reading') {
    if (!READINGS.length) return null;
    return generateReadingQuestion(diff);
  }
  return null;
}

// ===== 各题型生成 =====
function generateVocabQuestion(diff) {
  // Vocab: show word + pos, pick correct meaning from 4 options
  // diff 0: pick from easy word subset (first 1/3)
  // diff 1: middle 1/3
  // diff 2: last 1/3
  const third = Math.ceil(VOCAB.length / 3);
  let subset;
  if (diff <= 0) subset = VOCAB.slice(0, third);
  else if (diff === 1) subset = VOCAB.slice(third, third*2);
  else subset = VOCAB.slice(third*2);
  if (subset.length < 4) subset = VOCAB;
  
  const word = subset[rand(0, subset.length-1)];
  // Find 3 wrong meanings
  let wrongs = VOCAB.filter(v => v !== word).sort(() => Math.random() - 0.5).slice(0, 3).map(v => v[2]);
  // If not enough wrongs, fill
  while(wrongs.length < 3) wrongs.push('（干扰项）');
  
  const opts = shuffle([word[2], ...wrongs]);
  return {
    type: 'vocab',
    question: word[0] + ' (' + word[1] + ')',
    options: opts,
    answer: word[2],
    questionRaw: word,
  };
}

function generateClozeQuestion(diff) {
  const item = CLOZE[rand(0, CLOZE.length-1)];
  const sentence = item[0];
  const opts = item[1].split(', ');
  const correctIdx = item[2];
  const correctAnswer = opts[correctIdx];
  
  return {
    type: 'cloze',
    question: sentence.replace(/_{3,}/g, '______'),
    options: opts,
    answer: correctAnswer,
    answerIdx: correctIdx,
  };
}

function generateTransQuestion(diff) {
  const item = TRANS[rand(0, TRANS.length-1)];
  const chinese = item[0];
  const english = item[1];
  
  // Show Chinese, pick correct English translation from 4 options
  let wrongs = TRANS.filter(t => t !== item).sort(() => Math.random() - 0.5).slice(0, 3).map(t => t[1]);
  while(wrongs.length < 3) wrongs.push('(Translation variant)');
  
  const opts = shuffle([english, ...wrongs]);
  return {
    type: 'trans',
    question: '🌐 ' + chinese,
    options: opts,
    answer: english,
  };
}

function generateReadingQuestion(diff) {
  const article = READINGS[rand(0, READINGS.length-1)];
  if (!article.questions || !article.questions.length) return null;
  const q = article.questions[rand(0, article.questions.length-1)];
  const opts = q[1];
  const correctIdx = q[2];
  
  return {
    type: 'reading',
    question: '📄 ' + article.title + '\n\n' + article.text.substring(0, 200) + '...\n\n' + q[0],
    options: opts,
    answer: opts[correctIdx],
    answerIdx: correctIdx,
  };
}

// ===== 战斗系统 =====
function startBattle() {
  G.battleActive = true;
  showScreen('screen-battle');
  renderBattle();
}

function renderBattle() {
  const q = G.questions[G.questionIndex];
  if (!q) { endBattle(true); return; }
  
  const dungeon = DUNGEONS[G.currentDungeon];
  const enemyName = dungeon.enemy;
  const enemyHp = G.currentDungeon === 5 ? getBossMaxHp() : getEnemyMaxHp();
  const playerMax = G.maxHp;
  
  // HUD
  $('battle-hud').innerHTML = `
    <div class="unit">
      <div class="name enemy">🐉 ${enemyName}</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner enemy" id="enemy-hp-bar" style="width:${(G.enemyHp||enemyHp)/enemyHp*100}%"></div></div>
      <div style="font-size:8px;color:#ff6b6b" id="enemy-hp-text">${G.enemyHp||enemyHp}/${enemyHp}</div>
    </div>
    <div style="width:40px"></div>
    <div class="unit">
      <div class="name player">🧝 勇者 Lv.${G.lv}</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner player" id="player-hp-bar" style="width:${G.hp/playerMax*100}%"></div></div>
      <div style="font-size:8px;color:#7abb7a" id="player-hp-text">${G.hp}/${playerMax}</div>
    </div>
  `;
  
  // Boss hearts
  let bossHtml = '';
  if (G.currentDungeon === 5) {
    bossHtml = '<div class="boss-hearts">';
    for(let i=0; i<3; i++) {
      bossHtml += `<span class="boss-heart ${i <= G.bossPhase ? 'lost' : ''}">❤</span>`;
    }
    bossHtml += '</div>';
    $('battle-hud').innerHTML += bossHtml;
  }
  
  // Sprites
  const sprites = ['👾','👹','🧟','🦎','👻','🐉'];
  $('enemy-sprite').textContent = sprites[G.currentDungeon] || '👾';
  $('player-sprite').textContent = '🧝';
  
  // Enemy HP initialization
  if (G.enemyHp === undefined) {
    G.enemyHp = G.currentDungeon === 5 ? getBossMaxHp() : getEnemyMaxHp();
  }
  
  // Combo display
  updateComboDisplay();
  
  // Skill bar
  updateSkillBar();
  
  // Question
  renderQuestion(q);
  
  // Progress
  $('progress-indicator').textContent = `第 ${G.questionIndex+1}/${G.questions.length} 题`;
  
  // Log
  addLog('info', `${enemyName} 出现了！准备答题！`);
}

function getEnemyMaxHp() {
  return 50 + G.lv * 10;
}

function getBossMaxHp() {
  return 100;
}

function renderQuestion(q) {
  const typeLabels = {
    vocab: '📖 词汇选择 · 选择正确的中文释义',
    cloze: '✏️ 选词填空 · 选择正确的单词',
    trans: '🌐 中译英 · 选择正确的英文翻译',
    reading: '📄 阅读理解 · 选择正确答案',
  };
  $('question-type').textContent = typeLabels[q.type] || '答题';
  
  // Format question text
  let qText = q.question;
  // For reading questions, show excerpt
  if (q.type === 'reading') {
    qText = qText.replace(/\n/g, '<br>');
  }
  $('question-text').innerHTML = qText;
  
  // Options
  const letters = 'ABCDEFGH';
  let optsHtml = '';
  q.options.forEach((opt, i) => {
    optsHtml += `<button class="option-btn" onclick="answerQuestion(${i})" data-idx="${i}">${letters[i]}. ${opt}</button>`;
  });
  $('options-area').innerHTML = optsHtml;
}

function answerQuestion(idx) {
  if (!G.battleActive) return;
  const q = G.questions[G.questionIndex];
  if (!q) return;
  
  const chosen = q.options[idx];
  const correct = chosen === q.answer;
  
  // Disable all buttons
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
  
  if (correct) {
    // Correct!
    document.querySelectorAll('.option-btn')[idx].classList.add('correct');
    G.combo++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;
    
    // Calculate damage
    let baseDmg = G.currentDungeon === 5 ? 8 : 10;
    let comboMult = Math.min(G.combo, 5); let dmg = baseDmg * comboMult;
    
    // Double damage skill check
    if (G._doubleActive) {
      dmg *= 2;
      G._doubleActive = false;
      addLog('info', '⚡ 双倍分数发动！');
    }
    
    G.enemyHp -= dmg;
    G.stats.totalCorrect++;
    
    // XP
    addXP(Math.ceil(15 * comboMult));
    
    addLog('heal', `✓ 正确！(+${dmg}伤害) 连击×${comboMult}`);
    
    // Track accuracy
    trackAccuracy(q.type, true);
    
    // Heal small amount
    if (G.combo % 3 === 0) {
      G.hp = Math.min(G.maxHp, G.hp + 2);
      addLog('heal', '❤ 连击回复 +2HP');
    }
  } else {
    // Wrong!
    document.querySelectorAll('.option-btn').forEach(b => {
      if (b.dataset.idx == idx) b.classList.add('wrong');
      if (q.options[parseInt(b.dataset.idx)] === q.answer) b.classList.add('correct');
    });
    
    G.combo = 0;
    
    // Damage player unless shield
    if (G.shieldActive) {
      G.shieldActive = false;
      addLog('info', '🛡 免死金牌挡下了这次伤害！');
    } else {
      let dmg = G.currentDungeon === 5 ? 8 : 5;
      G.hp -= dmg;
      addLog('dmg', `✗ 错误！受到 ${dmg} 点伤害`);
    }
    
    G.stats.totalWrong++;
    trackAccuracy(q.type, false);
    
    // Add to error book
    let errorEntry = {
      type: q.type,
      question: q.question,
      yourAnswer: chosen,
      correctAnswer: q.answer,
    };
    G.errorBook.push(errorEntry);
    saveGame();
  }
  
  updateComboDisplay();
  updateSkillBar();
  updateBattleHUD();
  
  // Check win/lose
  if (G.enemyHp <= 0) {
    setTimeout(() => endBattle(true), 800);
    return;
  }
  if (G.hp <= 0) {
    setTimeout(() => endBattle(false), 800);
    return;
  }
  
  // Next question
  setTimeout(() => {
    G.questionIndex++;
    if (G.questionIndex >= G.questions.length) {
      endBattle(true);
    } else {
      renderBattle();
    }
    saveGame();
  }, 1000);
}

function endBattle(won) {
  G.battleActive = false;
  
  if (won) {
    // Dungeon cleared
    if (!G.completedDungeons.includes(G.currentDungeon)) {
      G.completedDungeons.push(G.currentDungeon);
      if (G.currentDungeon === 5) {
        G.gameCompleted = true;
        showScreen('screen-ending');
        saveGame();
        return;
      }
      G.stats.dungeonsCleared++;
      
      // Rewards
      const bonusXP = 50 * (G.currentDungeon + 1);
      addXP(bonusXP);
      
      // HP recovery
      G.hp = Math.min(G.maxHp, G.hp + 10);
      
      showResult('🏆', `🎉 击败了 ${DUNGEONS[G.currentDungeon].enemy}！\n获得 ${bonusXP} 经验值！\n回复 10 HP`);
    }
    G.enemyHp = undefined;
  } else {
    // Defeated - lose some xp, restore some hp
    G.xp = Math.max(0, G.xp - 30);
    G.hp = Math.ceil(G.maxHp * 0.3);
    G.enemyHp = undefined;
    showResult('💀', `你被 ${DUNGEONS[G.currentDungeon].enemy} 击败了...\n损失 30 经验值，体力恢复至 30%`);
  }
  
  G.combo = 0;
  updateHUD();
  saveGame();
}

function retreatBattle() {
  if (!confirm('确定撤退吗？当前进度不会保存！')) return;
  G.battleActive = false;
  G.enemyHp = undefined;
  G.combo = 0;
  goToMap();
}

// ===== 连击 & 技能 =====
function updateComboDisplay() {
  const mult = Math.min(G.combo, 5);
  $('combo-mult').textContent = '×' + mult;
  $('combo-count').textContent = `(${G.combo}连)`;
  $('combo-display').style.borderColor = G.combo >= 5 ? '#ffd700' : '#4a3a2a';
}

function updateSkillBar() {
  const canUse = G.combo >= 5;
  $('skill-double').disabled = !canUse;
  $('skill-shield').disabled = !canUse;
  $('skill-skip').disabled = !canUse;
  $('skill-double').className = 'skill-btn' + (canUse ? ' ready' : '');
  $('skill-shield').className = 'skill-btn' + (canUse ? ' ready' : '');
  $('skill-skip').className = 'skill-btn' + (canUse ? ' ready' : '');
}

function useSkill(type) {
  if (G.combo < 5) return;
  
  if (type === 'double') {
    // Double next question's damage
    addLog('info', '⚡ 双倍分数 activated for next correct answer!');
    // We handle this in answerQuestion
    G._doubleActive = true;
    G.combo = 0;
  } else if (type === 'shield') {
    G.shieldActive = true;
    addLog('info', '🛡 免死金牌 activated!');
    G.combo = 0;
  } else if (type === 'skip') {
    G.questionIndex++;
    addLog('info', '⏸ 跳过了这道题！');
    G.combo = 0;
    if (G.questionIndex >= G.questions.length) {
      endBattle(true);
    } else {
      renderBattle();
    }
  }
  
  updateComboDisplay();
  updateSkillBar();
}

// Actually handle double damage
// (patched into answerQuestion via modification)

// ===== XP & Level =====
function addXP(amount) {
  G.xp += amount;
  while (G.xp >= G.xpNext) {
    G.xp -= G.xpNext;
    G.lv++;
    G.xpNext = Math.floor(G.xpNext * 1.3);
    G.maxHp += 5;
    G.hp = Math.min(G.hp + 5, G.maxHp);
    addLog('info', `⭐ 升级！Lv.${G.lv}！HP增加！`);
  }
}

// ===== 自适应难度 =====
function trackAccuracy(type, correct) {
  if (!G.accuracy[type]) return;
  G.accuracy[type].total++;
  if (correct) G.accuracy[type].correct++;
  
  const acc = G.accuracy[type].correct / G.accuracy[type].total;
  if (acc > 0.8 && G.diffLevel[type] < 2) {
    G.diffLevel[type]++;
    addLog('info', `📈 ${type} 难度提升至 ${['简单','中等','困难'][G.diffLevel[type]]}`);
  } else if (acc < 0.4 && G.diffLevel[type] > 0) {
    G.diffLevel[type]--;
    addLog('info', `📉 ${type} 难度降低至 ${['简单','中等','困难'][G.diffLevel[type]]}`);
  }
}

// ===== 战斗HUD更新 =====
function updateBattleHUD() {
  const enemyMax = G.currentDungeon === 5 ? getBossMaxHp() : getEnemyMaxHp();
  $('enemy-hp-bar').style.width = Math.max(0, G.enemyHp / enemyMax * 100) + '%';
  $('enemy-hp-text').textContent = `${Math.max(0,G.enemyHp)}/${enemyMax}`;
  $('player-hp-bar').style.width = Math.max(0, G.hp / G.maxHp * 100) + '%';
  $('player-hp-text').textContent = `${Math.max(0,G.hp)}/${G.maxHp}`;
}

// ===== 日志 =====
function addLog(type, msg) {
  const log = $('battle-log');
  const p = document.createElement('div');
  p.className = type;
  p.textContent = '▸ ' + msg;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
  if (log.children.length > 20) log.removeChild(log.firstChild);
}

// ===== 弹窗 =====
function showResult(icon, text) {
  $('result-icon').textContent = icon;
  $('result-text').textContent = text;
  $('result-overlay').classList.add('show');
}

function closeResult() {
  $('result-overlay').classList.remove('show');
  goToMap();
}

// ===== 模式切换 =====
function switchMode(mode) {
  if (mode === G.mode) return;
  G.mode = mode;
  $('btn-mode-quest').className = mode === 'quest' ? 'active' : '';
  $('btn-mode-practice').className = mode === 'practice' ? 'active' : '';
  
  if (mode === 'practice') {
    startPractice();
  } else if (mode === 'quest') {
    renderMap();
    showScreen('screen-map');
  }
}

// ===== 专项训练 =====
function startPractice() {
  G.mode = 'practice';
  showScreen('screen-practice');
  $('practice-question-area').style.display = 'none';
  $('practice-ctrl').style.display = 'none';
  $('practice-log').style.display = 'none';
  // Show type selection
}

function startPracticeType(type) {
  G.practiceType = type;
  showScreen('screen-practice');
  G._practiceQuestions = [];
  for(let i=0; i<20; i++) {
    const q = generateOneQuestion(type, 1);
    if (q) G._practiceQuestions.push(q);
  }
  G._practiceIdx = 0;
  G._practiceAnswered = false;
  renderPracticeQuestion();
}

function renderPracticeQuestion() {
  const qs = G._practiceQuestions;
  if (!qs || G._practiceIdx >= qs.length) {
    $('practice-question-area').style.display = 'block';
    $('practice-question-text').innerHTML = '🎉 本轮练习完成！';
    $('practice-options-area').innerHTML = '';
    $('practice-ctrl').style.display = 'flex';
    $('practice-log').style.display = 'block';
    $('practice-log').innerHTML = '<div class="info">本轮练习结束，点击"下一题"开始新的一轮</div>';
    return;
  }
  
  const q = qs[G._practiceIdx];
  const typeLabels = {
    vocab: '📖 词汇选择 · 选择正确的中文释义',
    cloze: '✏️ 选词填空 · 选择正确的单词',
    trans: '🌐 中译英 · 选择正确的英文翻译',
    reading: '📄 阅读理解 · 选择正确答案',
  };
  
  $('practice-question-area').style.display = 'block';
  $('practice-ctrl').style.display = 'flex';
  $('practice-log').style.display = 'block';
  
  $('practice-question-type').textContent = typeLabels[q.type] || '答题';
  let qText = q.question;
  if (q.type === 'reading') qText = qText.replace(/\n/g, '<br>');
  $('practice-question-text').innerHTML = qText;
  
  const letters = 'ABCDEFGH';
  let html = '';
  q.options.forEach((opt, i) => {
    html += `<button class="option-btn" onclick="practiceAnswer(${i})" data-idx="${i}">${letters[i]}. ${opt}</button>`;
  });
  $('practice-options-area').innerHTML = html;
  $('practice-log').innerHTML = `<div class="info">第 ${G._practiceIdx+1} / ${qs.length} 题</div>`;
  G._practiceAnswered = false;
}

function practiceAnswer(idx) {
  if (G._practiceAnswered) return;
  G._practiceAnswered = true;
  
  const q = G._practiceQuestions[G._practiceIdx];
  const chosen = q.options[idx];
  const correct = chosen === q.answer;
  
  document.querySelectorAll('#practice-options-area .option-btn').forEach(b => b.disabled = true);
  
  if (correct) {
    document.querySelectorAll('#practice-options-area .option-btn')[idx].classList.add('correct');
    $('practice-log').innerHTML = `<div class="heal">✓ 正确！</div>`;
  } else {
    document.querySelectorAll('#practice-options-area .option-btn').forEach(b => {
      if (b.dataset.idx == idx) b.classList.add('wrong');
      if (q.options[parseInt(b.dataset.idx)] === q.answer) b.classList.add('correct');
    });
    $('practice-log').innerHTML = `<div class="dmg">✗ 错误！正确答案：${q.answer}</div>`;
    
    // Add to error book
    G.errorBook.push({
      type: q.type,
      question: q.question,
      yourAnswer: chosen,
      correctAnswer: q.answer,
    });
    saveGame();
  }
}

function practiceNext() {
  const qs = G._practiceQuestions;
  if (!qs || G._practiceIdx >= qs.length) {
    // Start new round
    startPracticeType(G.practiceType);
    return;
  }
  G._practiceIdx++;
  renderPracticeQuestion();
}

function showAnswer() {
  const q = G._practiceQuestions[G._practiceIdx];
  if (!q) return;
  document.querySelectorAll('#practice-options-area .option-btn').forEach(b => {
    b.disabled = true;
    if (q.options[parseInt(b.dataset.idx)] === q.answer) b.classList.add('correct');
  });
  $('practice-log').innerHTML = `<div class="info">🔍 答案：${q.answer}</div>`;
  G._practiceAnswered = true;
}

// ===== 错题本 =====
function showErrorBook() {
  if (G.errorBook.length === 0) {
    alert('🎉 错题本空空如也，继续保持！');
    return;
  }
  showScreen('screen-errorbook');
  renderErrorBook();
}

function renderErrorBook() {
  let html = `<div style="font-size:9px;color:#999;margin-bottom:10px">共 ${G.errorBook.length} 道错题</div>`;
  const typeNames = { vocab: '词汇', cloze: '选词填空', trans: '翻译', reading: '阅读' };
  G.errorBook.forEach((e, i) => {
    let question = e.question;
    if (question.length > 100) question = question.substring(0, 100) + '...';
    html += `<div class="error-item">
      <div class="q">[${typeNames[e.type]||e.type}] ${question}</div>
      <div class="your">✗ 你的回答：${e.yourAnswer}</div>
      <div class="correct">✓ 正确答案：${e.correctAnswer}</div>
    </div>`;
  });
  $('error-list').innerHTML = html;
}

function clearErrors() {
  if (!confirm('确定清空所有错题吗？')) return;
  G.errorBook = [];
  renderErrorBook();
  saveGame();
}

// ===== 导航 =====
function goToMap() {
  if (G.mode === 'practice') {
    startPractice();
  } else {
    renderMap();
    showScreen('screen-map');
  }
}

// ===== 存档 =====
function saveGame() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify(G));
  } catch(e) {}
}

function loadGame() {
  try {
    const data = localStorage.getItem(STATE_KEY);
    if (data) {
      const saved = JSON.parse(data);
      Object.assign(G, saved);
      return true;
    }
  } catch(e) {}
  return false;
}

function continueGame() {
  if (loadGame()) {
    addLog('info', '📀 存档已读取！');
    goToMap();
  } else {
    alert('没有找到存档');
  }
}

function resetGame() {
  if (!confirm('确定重置所有进度吗？')) return;
  localStorage.removeItem(STATE_KEY);
  Object.assign(G, {
    hp: 30, maxHp: 30, lv: 1, xp: 0, xpNext: 100,
    combo: 0, maxCombo: 0,
    shieldActive: false,
    currentDungeon: 0,
    completedDungeons: [],
    currentQuestion: 0, questionsTotal: 10,
    questions: [], questionIndex: 0,
    battleActive: false,
    errorBook: [],
    diffLevel: { vocab: 0, cloze: 0, trans: 0, reading: 0 },
    accuracy: { vocab: { correct:0, total:0 }, cloze: { correct:0, total:0 }, trans: { correct:0, total:0 }, reading: { correct:0, total:0 } },
    stats: { totalCorrect:0, totalWrong:0, dungeonsCleared:0 },
    bossPhase: 0, gameCompleted: false,
    mode: 'quest', practiceType: null,
  });
  showScreen('screen-intro');
}

function startAdventure() {
  if (loadGame()) {
    if (G.gameCompleted) {
      showScreen('screen-ending');
      return;
    }
    goToMap();
  } else {
    G.mode = 'quest';
    renderMap();
    showScreen('screen-map');
    saveGame();
  }
}

// ===== 键盘支持 =====
document.addEventListener('keydown', function(e) {
  if (e.key >= '1' && e.key <= '4') {
    const btns = document.querySelectorAll('.option-btn:not([disabled])');
    const idx = parseInt(e.key) - 1;
    if (btns[idx]) btns[idx].click();
  }
  if (e.key === 'Enter' || e.key === ' ') {
    const overlay = $('result-overlay');
    if (overlay.classList.contains('show')) {
      closeResult();
    }
  }
});
